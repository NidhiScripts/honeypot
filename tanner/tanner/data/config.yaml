DATA:
  # Using /opt paths (requires the symlink we made earlier)
  db_config: /opt/tanner/db/db_config.json
  dorks: /opt/tanner/data/dorks.pickle
  user_dorks: /opt/tanner/data/user_dorks.pickle
  crawler_stats: /opt/tanner/data/crawler_user_agents.txt
  geo_db: /opt/tanner/db/GeoLite2-City.mmdb
  tornado: /opt/tanner/data/tornado.py
  mako: /opt/tanner/data/mako.py

TANNER:
  host: 0.0.0.0
  port: 8090

WEB:
  host: 0.0.0.0
  port: 8091

API:
  host: 0.0.0.0
  port: 8092
  auth: False
  auth_signature: tanner_api_auth

PHPOX:
  host: 0.0.0.0
  port: 8088

REDIS:
  host: 127.0.0.1
  port: 6379
  poolsize: 10
  timeout: 1

EMULATORS:
  root_dir: /opt/tanner

# --- CRITICAL FIX: DISABLED DOCKER FEATURES ---
EMULATOR_ENABLED:
  sqli: True
  rfi: False            # Requires Docker -> DISABLED
  lfi: False            # Requires Docker -> DISABLED
  xss: True
  cmd_exec: False       # Requires Docker -> DISABLED
  php_code_injection: False # Requires Docker -> DISABLED
  php_object_injection: False
  crlf: True
  xxe_injection: False
  template_injection: False # Requires Docker -> DISABLED

SQLI:
  type: SQLITE
  db_name: tanner_db

XXE_INJECTION:
  OUT_OF_BAND: False

RFI:
  allow_insecure: False

DOCKER:
  host_image: busybox:latest

# --- LOGGING FOR AI ---
LOGGER:
  log_debug: /tmp/tanner_debug.log
  log_err: /tmp/tanner_error.log

MONGO:
  enabled: False
  URI: mongodb://localhost

HPFEEDS:
  enabled: False

LOCALLOG:
  enabled: True
  PATH: /tmp/tanner_report.json

CLEANLOG:
  enabled: False

SESSIONS:
  delete_timeout: 300
