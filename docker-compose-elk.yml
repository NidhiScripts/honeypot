version: '3.7'
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.0
    container_name: filebeat
    user: root
    # We mount the docker socket just in case we want autodiscover later, but strictly not needed for file mode
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Cowrie Logs
      - ./cowrie/var/log/cowrie/:/logs/cowrie/:ro
      # AI Logs (We assume the file exists relative to this compose file)
      - ./ai_analysis.json:/logs/ai_analysis.json:ro
      # Tanner Logs - Directly mount the file from tmp
      - /tmp/tanner_report.json:/logs/tanner/tanner_report.json:ro
    command: filebeat -e -strict.perms=false
    depends_on:
      - elasticsearch

volumes:
  es_data:
